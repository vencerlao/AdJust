name: Deploy to Vercel and HF Spaces

on:
  push:
    branches: [main, Vencer]
  pull_request:
    branches: [main]

env:
  HF_USERNAME: ${{ secrets.HF_USERNAME }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    name: Build Flutter Web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        run: |
          flutter build web \
            --dart-define=API_URL=${{ secrets.API_URL || 'http://localhost:5000' }}

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web/

  build-backend:
    runs-on: ubuntu-latest
    name: Build Backend (Python)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements_hf.txt

      - name: Lint Python code
        continue-on-error: true
        run: |
          pip install pylint
          pylint backend/app_hf.py --disable=all --enable=syntax-error

  deploy-frontend:
    needs: build-frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy Frontend to Vercel
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Build web
        run: |
          flutter build web \
            --dart-define=API_URL=${{ secrets.API_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./build/web

  deploy-backend:
    needs: build-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy Backend to HF Spaces
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git for HF
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Add HF Remote and Push
        run: |
          git remote add hf https://laovencer:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/laovencer/adjust-bias-detection.git || true
          git fetch hf main 2>/dev/null || true
          git push hf main --force-with-lease || echo "HF push failed (might not be configured)"
        continue-on-error: true

  test:
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    name: Run Tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test --no-test-assets
        continue-on-error: true

  notify:
    needs: [build-frontend, build-backend, test]
    if: always()
    runs-on: ubuntu-latest
    name: Notify on Status
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy-frontend.result }}" = "success" ] || [ "${{ needs.deploy-backend.result }}" = "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "⚠️  Some deployments may have failed. Check the logs."
          fi
